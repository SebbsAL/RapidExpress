# Copia este archivo a "db.properties" (mismo directorio, junto a pom.xml) y
# reemplaza los valores con los datos reales de tu base de datos MySQL en la
# nube. "db.properties" esta en .gitignore: nunca se sube al repositorio.
# No uses comillas alrededor de los valores.

DB_URL=jdbc:Mysql://***REMOVED-HOST***:3306/rapidexpress_db
DB_USER=root
DB_PASSWORD=***REMOVED-CREDENTIAL***
